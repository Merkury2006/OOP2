# ====================
# \u041F\u0420\u041E\u0424\u0418\u041B\u042C \u0420\u0410\u0417\u0420\u0410\u0411\u041E\u0422\u041A\u0418
# ====================

# \u0410\u041A\u0422\u0418\u0412\u0418\u0420\u0423\u0415\u041C \u041F\u0420\u041E\u0424\u0418\u041B\u042C (\u043C\u043E\u0436\u043D\u043E \u0442\u0430\u043A\u0436\u0435 \u0447\u0435\u0440\u0435\u0437 VM options)
# spring.profiles.active=dev

# \u041D\u0410\u0421\u0422\u0420\u041E\u0419\u041A\u0418 \u0414\u041B\u042F \u0420\u0410\u0417\u0420\u0410\u0411\u041E\u0422\u041A\u0418
spring.jpa.show-sql=true
spring.mail.debug=true
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG
logging.level.jakarta.mail=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# \u041F\u0423\u0422\u0418 \u0414\u041B\u042F \u0420\u0410\u0417\u0420\u0410\u0411\u041E\u0422\u041A\u0418
app.base-url=http://localhost:8080
app.upload.music-path=${user.dir}/Music/
app.upload.image-path=${user.dir}/Images/


# \u041A\u042D\u0428\u0418\u0420\u041E\u0412\u0410\u041D\u0418\u0415 (\u043E\u0442\u043A\u043B\u044E\u0447\u0430\u0435\u043C \u0434\u043B\u044F \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u043A\u0438)
spring.web.resources.cache.period=0
spring.thymeleaf.cache=false

# SpringDoc \u043A\u043E\u043D\u0444\u0438\u0433\u0443\u0440\u0430\u0446\u0438\u044F
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.api-docs.path=/v3/api-docs