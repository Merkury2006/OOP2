<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Merkury-Music</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="icon" type="image/png" th:href="@{/favicon-32x32.png}" sizes="32x32">
    <link rel="icon" type="image/png" th:href="@{/favicon-16x16.png}" sizes="16x16">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: rgba(128, 0, 128, 0.68);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-form {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.79);
            width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-form h2 {
            color: #800080;
            text-align: center;
        }

        .login-form input {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-form input[type="submit"] {
            width: 100%;
            background-color: #800080;
            color: #fff;
            cursor: pointer;
            border: none;
            padding: 10px;
            border-radius: 5px;
        }

        .error-message {
            color: red;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }

        .success-message {
            background-color: #51cf66;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            width: 100%;
            text-align: center;
            display: block;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }

        .link a {
            color: #800080;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .in {
            background-color: #800080;
            color: #fff;
            border: none;
            margin: 5px;
            padding: 5px;
            border-radius: 5px;
            cursor: pointer;
            width: 40%;
        }
    </style>
</head>
<body>

<div class="login-form">
    <h2>Регистрация</h2>

    <div th:if="${error}" class="error-message">
        <span th:text="${error}"></span>
    </div>

    <div th:if="${message}" th:class="${messageType == 'success'} ? 'success-message' : 'error-message'">
        <span th:text="${message}"></span>
    </div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <input type="text" th:field="*{username}" placeholder="Имя пользователя" required>
        <input type="email" th:field="*{email}" placeholder="Электронная почта" required>
        <input type="password" th:field="*{password}" placeholder="Пароль" required>
        <input type="submit" value="Зарегистрироваться">
    </form>

    <div class="link">
        <p>Уже зарегистрированы? <a th:href="@{/login}"><button class="in">Войти</button></a></p>
    </div>
</div>

</body>
</html>
