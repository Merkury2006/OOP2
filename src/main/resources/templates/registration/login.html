<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/static/favicon-16x16.png" type="image/png" sizes="16x16">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color:rgba(128, 0, 128, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-form {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.89);
            width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .auth-form h2 {
            color: #800080;
            text-align: center;
        }

        .auth-form input {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .auth-form input[type="submit"] {
            width: 100%;
            background-color: #800080;
            color: #fff;
            cursor: pointer;
            border: none;
            padding: 10px;
            border-radius: 5px;
        }

        .error {
            color: red;
            text-align: center;
        }

        .link {
            text-align: center;
            margin-top: 15px;
        }

        .link a {
            color: #800080;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .toast {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }
        .unreg {
            background-color: #800080;
            color: #fff;
            border: none;
            margin: 10px;
            padding: 5px;
            border-radius: 5px;
            cursor: pointer;
            width: 50%;
        }
    </style>
</head>
<body>

<div class="auth-form">
    <h2>Вход</h2>

    <div th:if="${error}" class="error-message">
        <span th:text="${error}"></span>
    </div>

    <div th:if="${message}" class="success-message">
        <span th:text="${message}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <input type="email" name="email" placeholder="Электронная почта" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="submit" value="Войти">
    </form>

    <div class="link">
        <p>Еще не зарегистрированы?
            <a th:href="@{/register}"><button class="unreg">Зарегистрироваться</button></a>
        </p>
    </div>
</div>

</body>
</html>
