<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Merkury-Music</title>
    <link rel="icon" th:href="@{/Images/favicon.ico}" type="image/x-icon">
    <link rel="icon" type="image/png" th:href="@{/Images/favicon-32x32.png}" sizes="32x32">
    <link rel="icon" type="image/png" th:href="@{/Images/favicon-16x16.png}" sizes="16x16">
    <link rel="stylesheet" th:href="@{/Styles/auth.css}">
</head>
<body>

<div class="auth-container">
    <h2>Вход в систему</h2>

    <div th:if="${error}" class="alert alert-error">
        <div th:text="${error}"></div>
        <div th:if="${error == 'Email не подтвержден' || error == 'Email не подтвержден. Проверьте вашу почту.'}"
             style="margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(211, 47, 47, 0.2);">
            <p style="margin: 0 0 5px 0; font-size: 14px;">Мы отправили письмо с подтверждением на ваш email.</p>
            <a th:href="@{/resend-verification}" style="color: #ff9800; font-weight: bold;">
                Отправить письмо повторно
            </a>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <form th:action="@{/login}" method="post" class="auth-form">
        <div class="form-group">
            <input type="email"
                   name="username"
                   placeholder="Ваш email"
                   required
                   th:value="${unverifiedEmail ?: ''}">
        </div>

        <div class="form-group password-wrapper">
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Пароль"
                   required>
            <button type="button" class="toggle-password" id="togglePasswordBtn">👁️</button>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="submit" value="Войти">
    </form>

    <div class="auth-links">
        <a th:href="@{/register}">Регистрация</a> |
        <a th:href="@{/password/forgot}">Забыли пароль?</a>
    </div>
</div>

<script th:src="@{/Scripts/auth.js}"></script>
</body>
</html>
