<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Повторная отправка - Merkury-Music</title>
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
    <link rel="icon" type="image/png" th:href="@{/favicon-32x32.png}" sizes="32x32">
    <link rel="icon" type="image/png" th:href="@{/favicon-16x16.png}" sizes="16x16">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: rgba(128, 0, 128, 0.68);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .resend-form {
            background-color: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.89);
            width: 350px;
        }

        .resend-form h2 {
            color: #800080;
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #800080;
            box-shadow: 0 0 0 2px rgba(128, 0, 128, 0.2);
        }

        .btn {
            width: 100%;
            background-color: #800080;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #6a006a;
        }

        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        .alert-success {
            background-color: #e6ffe6;
            color: #006600;
            border: 1px solid #99ff99;
        }

        .alert-error {
            background-color: #ffe6e6;
            color: #cc0000;
            border: 1px solid #ff9999;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .links a {
            color: #800080;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .info {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        .info-icon {
            font-size: 18px;
            margin-right: 5px;
        }

        @media (max-width: 400px) {
            .resend-form {
                width: 90%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="resend-form">
    <h2>📨 Повторная отправка письма</h2>

    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}"></span>
    </div>

    <div class="info">
        <span class="info-icon">💡</span>
        Введите email, указанный при регистрации
    </div>

    <form th:action="@{/resend-verification}" method="post">
        <div class="form-group">
            <label for="email">Электронная почта:</label>
            <input type="email" id="email" name="email"
                   placeholder="example@email.com" required>
        </div>

        <button type="submit" class="btn">Отправить письмо повторно</button>
    </form>

    <div class="links">
        <a href="/login">Войти</a> |
        <a href="/register">Регистрация</a> |
        <a href="/">Главная</a>
    </div>
</div>
</body>
</html>
