<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="fragments/header :: head"></head>
<body>

<header th:replace="fragments/header :: header(${activePage})"></header>

<div class="container">
    <div th:replace="fragments/sidebar :: sidebar(${activePage})"></div>

    <div class="main-content">
        <!-- Сообщение для незалогиненных -->
        <div th:if="${not isAuthenticated}" class="not-logged-in-message">
            <p>Чтобы добавлять свои треки на сайт, вам нужно
                <a th:href="@{/login}">войти</a> или
                <a th:href="@{/register}">зарегистрироваться</a>
            </p>
        </div>

        <!-- Для авторизованных -->
        <div th:if="${isAuthenticated}">
            <!-- Контейнер для уведомлений -->
            <div id="notification-container"></div>

            <!-- Форма загрузки трека -->
            <form id="uploadForm" enctype="multipart/form-data" class="track-form">
                <div class="label">Добавить свой трек</div>

                <div class="form-group">
                    <label for="track_name">Название трека</label>
                    <input type="text" id="track_name" name="trackName" required>
                    <span id="track_name_error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="artist">Исполнитель</label>
                    <input type="text" id="artist" name="artist">
                    <span id="artist_error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="genre">Жанр</label>
                    <select name="genre" id="genre" required>
                        <option value="" disabled selected>Выберите жанр</option>
                        <option value="Поп музыка">Поп-музыка</option>
                        <option value="Рок музыка">Рок-музыка</option>
                        <option value="Рэп музыка">Рэп-музыка</option>
                        <option value="Хип-хоп музыка">Хип-хоп музыка</option>
                        <option value="Электронная музыка">Электронная музыка</option>
                        <option value="Классическая музыка">Классика</option>
                        <option value="Фонк музыка">Фонк</option>
                        <option value="Джаз музыка">Джаз</option>
                        <option value="Металл музыка">Металл</option>
                    </select>
                    <span id="genre_error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <div class="track-label">
                        <label for="track_file">Трек</label>
                    </div>
                    <div class="file-input-container">
                        <label for="track_file" class="file-upload-btn">Выберите файл</label>
                        <input type="file" name="trackFile" id="track_file" accept="audio/*" required>
                        <span id="file-name" class="file-name">Файл не выбран</span>
                    </div>
                    <span id="track_file_error" class="error-message"></span>
                </div>

                <div class="form-group">
                    <div class="image-label">
                        <label for="image_file">Логотип трека</label>
                    </div>
                    <div class="image-input-container">
                        <label for="image_file" class="image-upload-btn">Выберите файл</label>
                        <input type="file" name="imageFile" id="image_file" accept="image/*" required>
                        <span id="image-name" class="file-name">Файл не выбран</span>
                    </div>
                    <span id="image_file_error" class="error-message"></span>
                </div>

                <button type="submit" id="submitButton" class="button-add-new-track">Добавить трек</button>
            </form>

            <!-- Секция с треками пользователя -->
            <div class="label">Ваши добавленные треки</div>

            <div class="main-genre-music">
                <!-- Сообщение если нет треков -->
                <div th:if="${userTracks == null or userTracks.isEmpty()}"
                     class="not-logged-in-message no-tracks-message">
                    <p>Вы пока не добавили ни одного трека</p>
                </div>

                <!-- Треки пользователя -->
                <div th:each="track : ${userTracks}"
                     class="container-sound"
                     th:id="'track-' + ${track.id}">

                    <div class="pause-button" style="display:none;">
                        <div class="rectangle"></div>
                        <div class="rectangle"></div>
                    </div>
                    <div class="play-button">
                        <div class="triangle"></div>
                    </div>

                    <img th:src="@{${track.imageUrl}}" alt="Обложка трека" class="image-sound">

                    <div class="all-duration">
                        <div class="container-duration">
                            <span class="time current-time">0:00</span>
                            <div class="main-pain">
                                <div class="text" th:text="${track.artist} + ' - ' + ${track.trackName}">
                                    Артист - Название трека
                                </div>
                                <audio class="audio-player" th:src="@{${track.trackUrl}}" preload="metadata"></audio>
                                <div class="progress-container">
                                    <div class="progress-bar"></div>
                                    <div class="progress-thumb"></div>
                                </div>
                            </div>
                            <span class="time duration">0:00</span>
                        </div>
                    </div>

                    <div class="button-container">
                        <!-- Кнопка лайка -->
                        <div class="like-container" th:id="'like-form-' + ${track.id}"
                             th:data-track-id="${track.id}">
                            <button type="button"
                                    class="heart-icon"
                                    th:classappend="(${likedTrackIds != null and likedTrackIds.contains(track.id)} ? 'liked' : '')">
                                <i th:class="${likedTrackIds != null and likedTrackIds.contains(track.id)} ?
                                     'fas fa-heart' : 'far fa-heart'"></i>
                            </button>
                        </div>

                        <!-- Кнопка скачивания -->
                        <div class="download-container" th:id="'download-form-' + ${track.id}"
                             th:data-track-id="${track.id}">
                            <button type="button"
                                    class="button-load"
                                    data-track-id="${track.id}">
                                <div class="arrow-down"></div>
                                <div class="line"></div>
                            </button>
                        </div>

                        <!-- Кнопка удаления -->
                        <div class="delete-container" th:id="'delete-form-' + ${track.id}"
                             th:data-track-id="${track.id}">
                            <button type="button"
                                    class="trash-icon"
                                    data-track-id="${track.id}"
                                    title="Удалить трек"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
<script th:src="@{/Scripts/upload_track.js}"></script>
<script th:src="@{/Scripts/delete_track.js}"></script>
</body>
</html>
