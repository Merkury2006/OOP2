<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Установка нового пароля - Merkury-Music</title>
    <link rel="icon" th:href="@{/Images/favicon.ico}" type="image/x-icon">
    <link rel="icon" type="image/png" th:href="@{/Images/favicon-32x32.png}" sizes="32x32">
    <link rel="icon" type="image/png" th:href="@{/Images/favicon-16x16.png}" sizes="16x16">
    <link rel="stylesheet" th:href="@{/Styles/auth.css}">
</head>
<body>

<div class="auth-container">
    <h2>🔐 Установка нового пароля</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="info-box">
        <p>Придумайте новый пароль для вашего аккаунта.</p>
        <p><strong>Требования к паролю:</strong></p>
        <ul>
            <li>Минимум 6 символов</li>
            <li>Хотя бы одна цифра и одна буква</li>
        </ul>
    </div>

    <form th:action="@{/password/reset}"
          th:object="${newPasswordRequest}"
          method="post"
          class="auth-form">

        <input type="hidden" name="token" th:value="${token}">

        <div class="form-group password-wrapper">
            <input type="password"
                   th:field="*{newPassword}"
                   id="newPassword"
                   placeholder="Новый пароль"
                   required>
            <button type="button" class="toggle-password" data-target="newPassword">👁️</button>
            <div th:if="${#fields.hasErrors('newPassword')}" class="error-text">
                <span th:errors="*{newPassword}"></span>
            </div>
        </div>

        <div class="form-group password-wrapper">
            <input type="password"
                   th:field="*{confirmPassword}"
                   id="confirmPassword"
                   placeholder="Повторите новый пароль"
                   required>
            <button type="button" class="toggle-password" data-target="confirmPassword">👁️</button>
            <div th:if="${#fields.hasErrors('confirmPassword')}" class="error-text">
                <span th:errors="*{confirmPassword}"></span>
            </div>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="submit" value="Установить новый пароль">
    </form>

    <div class="auth-links">
        <a th:href="@{/login}">Вернуться к входу</a>
    </div>
</div>

<script th:src="@{/Scripts/auth.js}"></script>
</body>
</html>
