<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля - Merkury-Music</title>
    <link rel="icon" th:href="@{/Images/favicon.ico}" type="image/x-icon">
    <link rel="icon" type="image/png" th:href="@{/Images/favicon-32x32.png}" sizes="32x32">
    <link rel="icon" type="image/png" th:href="@{/Images/favicon-16x16.png}" sizes="16x16">
    <link rel="stylesheet" th:href="@{/Styles/auth.css}">
</head>
<body>

<div class="auth-container">
    <h2>🔑 Восстановление пароля</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="info-box">
        <ul>
            <li>Введите email, указанный при регистрации</li>
            <li>Мы отправим вам письмо со ссылкой для сброса пароля</li>
            <li>Перейдите по ссылке и установите новый пароль</li>
        </ul>
    </div>

    <form th:action="@{/password/forgot}"
          th:object="${passwordResetRequest}"
          method="post"
          class="auth-form">

        <div class="form-group">
            <input type="email"
                   th:field="*{email}"
                   placeholder="Введите email, указанный при регистрации"
                   required
                   th:class="${#fields.hasErrors('email')} ? 'field-error' : ''">

            <div th:if="${#fields.hasErrors('email')}" class="error-text">
                <span th:errors="*{email}"></span>
            </div>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="submit" value="Отправить инструкции">
    </form>

    <div class="auth-links">
        <a th:href="@{/login}">← Вернуться к входу</a>
        <span>|</span>
        <a th:href="@{/register}">Регистрация</a>
        <span>|</span>
        <a th:href="@{/}">Главная</a>
    </div>
</div>

</body>
</html>
